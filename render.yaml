# Render Blueprint: New + > Blueprint, pick this repo (portfolio-b). Free plan, no card needed.
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    # devDependencies are needed to compile (Nest CLI, TypeScript), so install them even with NODE_ENV=production.
    # `prisma migrate deploy` applies pending migrations to your Neon database on every deploy.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true   # Render creates a long random secret for you
      - key: DATABASE_URL
        sync: false           # paste your Neon connection string in the Render dashboard
      - key: FRONTEND_ORIGIN
        sync: false           # your Vercel URL, e.g. https://your-site.vercel.app (comma-separate several)
      - key: PUBLIC_API_URL
        sync: false           # https://<this-service>.onrender.com/api
